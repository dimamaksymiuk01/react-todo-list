<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      var path = window.location.pathname.replace('/react-todo-list', '');
      var redirect = '/react-todo-list/' + (path === '/' || path === '' ? '' : '?p=' + path);
      window.location.replace(redirect);
    </script>
  </head>
  <body>
  </body>
</html>
